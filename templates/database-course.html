<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Database Management - AI Learn</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #111827;
            color: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 22px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .header {
            background: linear-gradient(
                135deg,
                #0891b2,
                #2563eb
            );
            color: white;
            padding: 45px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
        }

        .progress-container {
            max-width: 1100px;
            margin: 25px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #0891b2;
            transition: 0.4s;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .learning-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
        }

        .lessons {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            height: fit-content;
        }

        .lessons h3 {
            margin-bottom: 15px;
            color: #0891b2;
        }

        .lesson-btn {
            width: 100%;
            border: none;
            background: #f3f4f6;
            padding: 13px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
        }

        .lesson-btn:hover {
            background: #cffafe;
        }

        .lesson-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            min-height: 450px;
        }

        .lesson-content h2 {
            color: #0891b2;
            margin-bottom: 20px;
        }

        .lesson-content p {
            line-height: 1.7;
            margin-bottom: 18px;
            font-size: 16px;
        }

        .code-box {
            background: #111827;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            line-height: 1.7;
            overflow-x: auto;
        }

        .complete-btn {
            background: #0891b2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        .complete-btn:hover {
            background: #0e7490;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .navigation button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .navigation button:hover {
            background: #1d4ed8;
        }

        .quiz-question {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .quiz-option {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ddd;
            background: #f9fafb;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
        }

        .quiz-option:hover {
            background: #cffafe;
        }

        .quiz-option:disabled {
            cursor: not-allowed;
        }

        .quiz-result {
            margin-top: 25px;
            text-align: center;
        }

        .completion {
            margin-top: 25px;
            padding: 25px;
            background: #ecfeff;
            border: 2px solid #0891b2;
            border-radius: 12px;
            text-align: center;
        }

        .completion h2 {
            color: #0891b2;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                gap: 10px;
            }

            nav a {
                margin-left: 10px;
                margin-right: 10px;
            }

            .header h1 {
                font-size: 30px;
            }

            .learning-layout {
                grid-template-columns: 1fr;
            }

            .lesson-content {
                padding: 20px;
            }

        }

    </style>

</head>

<body>


<nav>

    <h2>🗄️ AI Learn</h2>

    <div>

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

    </div>

</nav>


<section class="header">

    <h1>
        🗄️ Database Management
    </h1>

    <p>
        Learn databases, SQL, tables,
        relationships and normalization.
    </p>

</section>


<div class="progress-container">

    <div class="progress-info">

        <span>
            Course Progress
        </span>

        <span id="progressText">
            0%
        </span>

    </div>

    <div class="progress-bar">

        <div
            class="progress-fill"
            id="progressFill">
        </div>

    </div>

</div>


<div class="container">

    <div class="learning-layout">


        <div class="lessons">

            <h3>
                📚 Lessons
            </h3>


            <button
                class="lesson-btn"
                onclick="showLesson(0)">

                1. Introduction to Databases

            </button>


            <button
                class="lesson-btn"
                onclick="showLesson(1)">

                2. DBMS and RDBMS

            </button>


            <button
                class="lesson-btn"
                onclick="showLesson(2)">

                3. Tables and Keys

            </button>


            <button
                class="lesson-btn"
                onclick="showLesson(3)">

                4. SQL Basics

            </button>


            <button
                class="lesson-btn"
                onclick="showLesson(4)">

                5. SQL Queries

            </button>


            <button
                class="lesson-btn"
                onclick="showLesson(5)">

                6. Joins and Relationships

            </button>


            <button
                class="lesson-btn"
                onclick="showLesson(6)">

                7. Database Normalization

            </button>


            <button
                class="lesson-btn"
                onclick="showLesson(7)">

                8. Database Quiz

            </button>

        </div>


        <div class="lesson-content">

            <h2 id="lessonTitle">
                Introduction to Databases
            </h2>


            <div id="lessonContent">
            </div>


            <div class="navigation">

                <button
                    id="previousBtn"
                    onclick="previousLesson()">

                    ⬅️ Previous

                </button>


                <button
                    id="nextBtn"
                    onclick="nextLesson()">

                    Next ➡️

                </button>

            </div>

        </div>

    </div>

</div>


<script>


const lessons = [

    {
        title: "Introduction to Databases",

        content: `

            <p>
                A database is an organized collection
                of data that can be easily accessed,
                managed, and updated.
            </p>

            <div class="code-box">

                Student Database<br><br>

                ID | Name | Course<br>

                1 | Ravi | Python<br>

                2 | Sita | Java

            </div>

        `
    },


    {
        title: "DBMS and RDBMS",

        content: `

            <p>
                DBMS stands for Database Management
                System. It is software used to create,
                store, manage, and retrieve data.
            </p>

            <p>
                RDBMS stores data in tables and
                connects related tables using
                relationships.
            </p>

            <div class="code-box">

                Examples:<br><br>

                MySQL<br>

                PostgreSQL<br>

                Oracle<br>

                SQL Server

            </div>

        `
    },


    {
        title: "Tables and Keys",

        content: `

            <p>
                A table stores data in rows and columns.
                Keys help identify and connect records.
            </p>

            <div class="code-box">

                Student Table<br><br>

                ID | Name | Age<br>

                1 | Ravi | 20<br>

                2 | Sita | 21

            </div>

            <p>
                A Primary Key uniquely identifies
                each record in a table.
            </p>

        `
    },


    {
        title: "SQL Basics",

        content: `

            <p>
                SQL stands for Structured Query
                Language. It is used to communicate
                with databases.
            </p>

            <div class="code-box">

                CREATE TABLE students (<br>

                &nbsp;&nbsp;id INT PRIMARY KEY,<br>

                &nbsp;&nbsp;name VARCHAR(50),<br>

                &nbsp;&nbsp;age INT<br>

                );

            </div>

        `
    },


    {
        title: "SQL Queries",

        content: `

            <p>
                SQL queries are used to insert,
                retrieve, update, and delete data.
            </p>

            <div class="code-box">

                SELECT * FROM students;<br><br>

                INSERT INTO students<br>

                VALUES (1, 'Ravi', 20);

            </div>

        `
    },


    {
        title: "Joins and Relationships",

        content: `

            <p>
                Joins are used to combine data
                from two or more related tables.
            </p>

            <div class="code-box">

                SELECT students.name,
                courses.course_name<br>

                FROM students<br>

                JOIN courses<br>

                ON students.course_id =
                courses.id;

            </div>

            <p>
                Common joins include INNER JOIN,
                LEFT JOIN, RIGHT JOIN, and FULL JOIN.
            </p>

        `
    },


    {
        title: "Database Normalization",

        content: `

            <p>
                Database normalization is a technique
                used to organize data efficiently.
            </p>

            <p>
                It helps reduce duplicate data and
                improves database consistency.
            </p>

            <div class="code-box">

                Benefits:<br><br>

                ✔ Reduces data duplication<br>

                ✔ Improves data consistency<br>

                ✔ Makes database easier to manage

            </div>

        `
    }

];


const quizQuestions = [

    {
        question:
            "What is a database?",

        options: [
            "A collection of organized data",
            "A programming language",
            "A web browser",
            "An operating system"
        ],

        answer: 0

    },


    {
        question:
            "What does SQL stand for?",

        options: [
            "Simple Query Language",
            "Structured Query Language",
            "System Query Language",
            "Standard Question Language"
        ],

        answer: 1

    },


    {
        question:
            "Which key uniquely identifies a record?",

        options: [
            "Foreign Key",
            "Primary Key",
            "Normal Key",
            "Data Key"
        ],

        answer: 1

    },


    {
        question:
            "Which SQL command is used to retrieve data?",

        options: [
            "INSERT",
            "DELETE",
            "SELECT",
            "UPDATE"
        ],

        answer: 2

    },


    {
        question:
            "What is the purpose of normalization?",

        options: [
            "Increase duplicate data",
            "Delete all data",
            "Reduce data duplication",
            "Create passwords"
        ],

        answer: 2

    }

];


let currentLesson = 0;

let completedLessons =
    JSON.parse(
        localStorage.getItem(
            "databaseCompletedLessons"
        )
    ) || [];


let currentQuizQuestion = 0;

let quizScore = 0;


function showLesson(index) {

    currentLesson = index;


    const lessonTitle =
        document.getElementById(
            "lessonTitle"
        );


    const lessonContent =
        document.getElementById(
            "lessonContent"
        );


    if (index === 7) {

        showQuiz();

        updateNavigation();

        return;

    }


    lessonTitle.innerText =
        lessons[index].title;


    lessonContent.innerHTML =
        lessons[index].content;


    const completeButton =
        document.createElement("button");


    completeButton.className =
        "complete-btn";


    completeButton.innerText =
        completedLessons.includes(index)
        ? "✅ Lesson Completed"
        : "✅ Mark Lesson as Completed";


    completeButton.onclick =
        markCompleted;


    lessonContent.appendChild(
        completeButton
    );


    updateNavigation();

}


function markCompleted() {

    if (
        !completedLessons.includes(
            currentLesson
        )
    ) {

        completedLessons.push(
            currentLesson
        );


        localStorage.setItem(
            "databaseCompletedLessons",
            JSON.stringify(
                completedLessons
            )
        );

    }


    showLesson(currentLesson);

    updateProgress();

}


function updateNavigation() {

    const previousBtn =
        document.getElementById(
            "previousBtn"
        );


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    previousBtn.style.display =
        currentLesson === 0
        ? "none"
        : "inline-block";


    nextBtn.style.display =
        currentLesson === 7
        ? "none"
        : "inline-block";

}


function previousLesson() {

    if (currentLesson > 0) {

        showLesson(
            currentLesson - 1
        );

    }

}


function nextLesson() {

    if (currentLesson < 7) {

        showLesson(
            currentLesson + 1
        );

    }

}


function updateProgress() {

    const completed =
        completedLessons.length;


    const percentage =
        Math.round(
            (completed / 7) * 100
        );


    document.getElementById(
        "progressText"
    ).innerText =
        percentage + "%";


    document.getElementById(
        "progressFill"
    ).style.width =
        percentage + "%";

}


function showQuiz() {

    const lessonTitle =
        document.getElementById(
            "lessonTitle"
        );


    const lessonContent =
        document.getElementById(
            "lessonContent"
        );


    lessonTitle.innerText =
        "📝 Database Quiz";


    lessonContent.innerHTML = `

        <div class="quiz-question"
             id="quizQuestion">
        </div>

        <div id="quizOptions">
        </div>

        <button
            id="nextQuizBtn"
            class="complete-btn"
            onclick="nextQuizQuestion()">

            Next Question ➡️

        </button>

        <div
            id="quizResult"
            class="quiz-result">
        </div>

    `;


    currentQuizQuestion = 0;

    quizScore = 0;


    loadQuizQuestion();

}


function loadQuizQuestion() {

    const question =
        quizQuestions[
            currentQuizQuestion
        ];


    document.getElementById(
        "quizQuestion"
    ).innerText =
        (
            currentQuizQuestion + 1
        ) +
        ". " +
        question.question;


    const optionsContainer =
        document.getElementById(
            "quizOptions"
        );


    optionsContainer.innerHTML = "";


    question.options.forEach(
        (option, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "quiz-option";


            button.innerText =
                option;


            button.onclick =
                () => checkQuizAnswer(
                    index
                );


            optionsContainer.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "nextQuizBtn"
    ).style.display =
        "none";

}


function checkQuizAnswer(
    selectedAnswer
) {

    const question =
        quizQuestions[
            currentQuizQuestion
        ];


    const options =
        document.querySelectorAll(
            ".quiz-option"
        );


    options.forEach(
        button => {

            button.disabled = true;

        }
    );


    if (
        selectedAnswer ===
        question.answer
    ) {

        quizScore++;


        options[
            selectedAnswer
        ].innerText +=
            " ✅";

    }

    else {

        options[
            selectedAnswer
        ].innerText +=
            " ❌";


        options[
            question.answer
        ].innerText +=
            " ✅";

    }


    document.getElementById(
        "nextQuizBtn"
    ).style.display =
        "inline-block";

}


function nextQuizQuestion() {

    currentQuizQuestion++;


    if (
        currentQuizQuestion <
        quizQuestions.length
    ) {

        loadQuizQuestion();

    }

    else {

        showQuizResult();

    }

}


function showQuizResult() {

    document.getElementById(
        "quizQuestion"
    ).innerText =
        "🎉 Quiz Completed!";


    document.getElementById(
        "quizOptions"
    ).innerHTML = "";


    document.getElementById(
        "nextQuizBtn"
    ).style.display =
        "none";


    document.getElementById(
        "quizResult"
    ).innerHTML = `

        <h2>
            Your Score:
            ${quizScore} /
            ${quizQuestions.length}
        </h2>

        <p>
            ${
                quizScore ===
                quizQuestions.length

                ? "🏆 Excellent! You got all answers correct!"

            : "👍 Good job! Keep practicing."
        }
    </p>


    ${
        quizScore ===
        quizQuestions.length

        ? `

            <div class="completion">

                <h2>
                    🎉 Congratulations!
                </h2>

                <h3>
                    Database Management
                    Course Completed!
                </h3>

                <p>
                    You have successfully
                    completed all lessons
                    and the quiz. 🏆
                </p>

            </div>

          `

        : ""

    }


    <button
        class="complete-btn"
        onclick="restartQuiz()">

        🔄 Try Again

    </button>

`;


localStorage.setItem(
    "databaseCourseCompleted",
    "true"
);

}


function restartQuiz() {

    currentQuizQuestion = 0;

    quizScore = 0;


    document.getElementById(
        "quizResult"
    ).innerHTML = "";


    loadQuizQuestion();

}


showLesson(0);

updateProgress();

</script>


</body>

</html>
