<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Machine Learning - AI Learn</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #111827;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .course-header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .course-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .learning-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
        }

        .lessons {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .lessons h3 {
            margin-bottom: 15px;
        }

        .lesson-btn {
            width: 100%;
            padding: 13px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            background: #eef2ff;
            color: #222;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
        }

        .lesson-btn:hover {
            background: #dbeafe;
        }

        .lesson-btn.active {
            background: #2563eb;
            color: white;
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            min-height: 500px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .content h2 {
            color: #2563eb;
            margin-bottom: 20px;
        }

        .content h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #374151;
        }

        .content p {
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .content ul {
            margin: 15px 0 15px 25px;
            line-height: 1.8;
        }

        .info-box {
            background: #eff6ff;
            border-left: 5px solid #2563eb;
            padding: 15px;
            margin-top: 20px;
            border-radius: 6px;
        }

        .complete-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 15px;
        }

        .complete-btn:hover {
            background: #15803d;
        }

        #completeMessage {
            margin-top: 15px;
            color: #16a34a;
            font-weight: bold;
        }

        .progress-box {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #2563eb;
            transition: 0.3s;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .navigation button {
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .navigation button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .quiz {
            background: #f8fafc;
            padding: 25px;
            border-radius: 12px;
        }

        .quiz h2 {
            color: #2563eb;
        }

        #quizQuestion {
            margin: 20px 0;
        }

        .quiz-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .quiz-option:hover {
            background: #eef2ff;
        }

        .quiz-option:disabled {
            cursor: not-allowed;
        }

        #quizResult {
            margin-top: 20px;
            font-weight: bold;
        }

        .completion {
            background: #ecfdf5;
            border: 2px solid #16a34a;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }

        .completion h2 {
            color: #16a34a;
        }

        @media (max-width: 800px) {

            nav {
                padding: 15px 20px;
            }

            .learning-layout {
                grid-template-columns: 1fr;
            }

            .course-header h1 {
                font-size: 28px;
            }

            .container {
                width: 95%;
            }
        }

    </style>

</head>

<body>

<nav>

    <h2>🤖 AI Learn</h2>

    <div>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
    </div>

</nav>


<div class="course-header">

    <h1>🤖 Machine Learning</h1>

    <p>Learn Machine Learning from basics to important concepts</p>

</div>


<div class="container">

    <div class="progress-box">

        <strong>Course Progress:
            <span id="progressText">0%</span>
        </strong>

        <div class="progress-bar">

            <div class="progress-fill"
                 id="progressFill">
            </div>

        </div>

    </div>


    <div class="learning-layout">


        <div class="lessons">

            <h3>📚 Lessons</h3>

            <button class="lesson-btn"
                    onclick="showLesson(0)">
                1. Introduction to Machine Learning
            </button>

            <button class="lesson-btn"
                    onclick="showLesson(1)">
                2. Types of Machine Learning
            </button>

            <button class="lesson-btn"
                    onclick="showLesson(2)">
                3. Supervised Learning
            </button>

            <button class="lesson-btn"
                    onclick="showLesson(3)">
                4. Unsupervised Learning
            </button>

            <button class="lesson-btn"
                    onclick="showLesson(4)">
                5. Training and Testing
            </button>

            <button class="lesson-btn"
                    onclick="showLesson(5)">
                6. Regression
            </button>

            <button class="lesson-btn"
                    onclick="showLesson(6)">
                7. Classification
            </button>

            <button class="lesson-btn"
                    onclick="showLesson(7)">
                8. Machine Learning Quiz
            </button>

        </div>


        <div class="content"
             id="lessonContent">
        </div>

    </div>

</div>


<script>

const lessons = [

    {
        title: "Introduction to Machine Learning",

        content: `

            <h2>Introduction to Machine Learning</h2>

            <p>
                Machine Learning is a branch of Artificial Intelligence
                that allows computers to learn from data and make
                predictions or decisions without being explicitly
                programmed for every task.
            </p>

            <h3>What is Machine Learning?</h3>

            <p>
                Machine Learning uses algorithms to identify patterns
                in data. The model learns from previous examples and
                uses the learned patterns to make predictions on new data.
            </p>

            <h3>Simple Example</h3>

            <p>
                If we provide a Machine Learning system with many
                examples of cats and dogs, it can learn the differences
                between them and identify a new image as a cat or dog.
            </p>

            <h3>Applications</h3>

            <ul>
                <li>Recommendation Systems</li>
                <li>Spam Email Detection</li>
                <li>Face Recognition</li>
                <li>Fraud Detection</li>
                <li>Medical Diagnosis</li>
                <li>Self-Driving Vehicles</li>
            </ul>

            <div class="info-box">
                <strong>Key Point:</strong>
                Machine Learning enables computers to learn patterns
                from data and make predictions or decisions.
            </div>

            <button class="complete-btn"
                    onclick="markCompleted()">
                Mark as Completed
            </button>

            <div id="completeMessage"></div>

        `
    },


    {
        title: "Types of Machine Learning",

        content: `

            <h2>Types of Machine Learning</h2>

            <p>
                Machine Learning is mainly divided into three major
                types based on how the model learns from data.
            </p>

            <h3>1. Supervised Learning</h3>

            <p>
                The model learns from labeled data where both input
                and correct output are provided.
            </p>

            <p>
                Example: Predicting whether an email is Spam or
                Not Spam.
            </p>

            <h3>2. Unsupervised Learning</h3>

            <p>
                The model learns from data without predefined labels
                and finds hidden patterns or groups.
            </p>

            <p>
                Example: Grouping customers based on shopping behavior.
            </p>

            <h3>3. Reinforcement Learning</h3>

            <p>
                The model learns by interacting with an environment
                and receiving rewards or penalties.
            </p>

            <p>
                Example: Training a game-playing AI.
            </p>

            <div class="info-box">
                <strong>Key Point:</strong>
                The three common types are Supervised Learning,
                Unsupervised Learning and Reinforcement Learning.
            </div>

            <button class="complete-btn"
                    onclick="markCompleted()">
                Mark as Completed
            </button>

            <div id="completeMessage"></div>

        `
    },


    {
        title: "Supervised Learning",

        content: `

            <h2>Supervised Learning</h2>

            <p>
                Supervised Learning is a type of Machine Learning where
                the model learns from labeled data.
            </p>

            <h3>What is Supervised Learning?</h3>

            <p>
                In supervised learning, we provide the machine with
                input data along with the correct output. The model
                learns the relationship between input and output and
                uses that knowledge to make predictions on new data.
            </p>

            <h3>Example</h3>

            <p>
                Suppose we want to predict whether an email is
                Spam or Not Spam.
            </p>

            <ul>
                <li>Input → Email message</li>
                <li>Output → Spam or Not Spam</li>
                <li>Training data → Emails with correct labels</li>
            </ul>

            <h3>Types of Supervised Learning</h3>

            <ul>
                <li><strong>Regression</strong> – Used to predict continuous values.</li>
                <li><strong>Classification</strong> – Used to predict categories or classes.</li>
            </ul>

            <h3>Popular Algorithms</h3>

            <ul>
                <li>Linear Regression</li>
                <li>Logistic Regression</li>
                <li>Decision Tree</li>
                <li>Random Forest</li>
                <li>Support Vector Machine</li>
                <li>K-Nearest Neighbors</li>
            </ul>

            <h3>Applications</h3>

            <ul>
                <li>Email spam detection</li>
                <li>House price prediction</li>
                <li>Medical diagnosis</li>
                <li>Fraud detection</li>
                <li>Student performance prediction</li>
            </ul>

            <div class="info-box">
                <strong>Key Point:</strong>
                Supervised Learning learns from labeled data and
                uses learned patterns to predict outputs for new data.
            </div>

            <button class="complete-btn"
                    onclick="markCompleted()">
                Mark as Completed
            </button>

            <div id="completeMessage"></div>

        `
    },


    {
        title: "Unsupervised Learning",

        content: `

            <h2>Unsupervised Learning</h2>

            <p>
                Unsupervised Learning is a type of Machine Learning
                where the model learns from data without labeled answers.
            </p>

            <h3>What is Unsupervised Learning?</h3>

            <p>
                The machine receives data without predefined labels.
                The algorithm tries to find hidden patterns, groups
                or relationships in the data.
            </p>

            <h3>Example</h3>

            <p>
                A shopping website can group customers based on their
                shopping behavior without knowing the groups beforehand.
            </p>

            <h3>Types</h3>

            <ul>
                <li><strong>Clustering</strong> – Groups similar data.</li>
                <li><strong>Association</strong> – Finds relationships between items.</li>
                <li><strong>Dimensionality Reduction</strong> – Reduces the number of features.</li>
            </ul>

            <h3>Popular Algorithms</h3>

            <ul>
                <li>K-Means Clustering</li>
                <li>Hierarchical Clustering</li>
                <li>DBSCAN</li>
                <li>Apriori Algorithm</li>
                <li>Principal Component Analysis</li>
            </ul>

            <div class="info-box">
                <strong>Key Point:</strong>
                Unsupervised Learning finds hidden patterns and
                structures in unlabeled data.
            </div>

            <button class="complete-btn"
                    onclick="markCompleted()">
                Mark as Completed
            </button>

            <div id="completeMessage"></div>

        `
    },


    {
        title: "Training and Testing",

        content: `

            <h2>Training and Testing</h2>

            <p>
                Machine Learning models need data to learn patterns.
                The data is usually divided into training data and
                testing data.
            </p>

            <h3>Training Data</h3>

            <p>
                Training data is used to teach the Machine Learning
                model. The model learns patterns and relationships
                from this data.
            </p>

            <h3>Testing Data</h3>

            <p>
                Testing data is used to check how well the trained
                model performs on new and unseen data.
            </p>

            <h3>Common Data Split</h3>

            <ul>
                <li>Training Data → 80%</li>
                <li>Testing Data → 20%</li>
            </ul>

            <h3>Overfitting</h3>

            <p>
                Overfitting occurs when a model performs very well
                on training data but performs poorly on new data.
            </p>

            <h3>Underfitting</h3>

            <p>
                Underfitting occurs when a model is too simple and
                cannot learn important patterns from the data.
            </p>

            <div class="info-box">
                <strong>Key Point:</strong>
                Training teaches the model, while testing checks
                how well the model works on unseen data.
            </div>

            <button class="complete-btn"
                    onclick="markCompleted()">
                Mark as Completed
            </button>

            <div id="completeMessage"></div>

        `
    },


    {
        title: "Regression",

        content: `

            <h2>Regression</h2>

            <p>
                Regression is a supervised Machine Learning technique
                used to predict continuous numerical values.
            </p>

            <h3>Examples</h3>

            <ul>
                <li>Predicting house prices</li>
                <li>Predicting temperature</li>
                <li>Predicting salary</li>
                <li>Predicting sales</li>
                <li>Predicting stock values</li>
            </ul>

            <h3>Types of Regression</h3>

            <ul>
                <li>Linear Regression</li>
                <li>Multiple Linear Regression</li>
                <li>Polynomial Regression</li>
                <li>Ridge Regression</li>
                <li>Lasso Regression</li>
            </ul>

            <h3>Simple Example</h3>

            <p>
                If house size increases, the price of the house may
                also increase. A regression model can learn this
                relationship and predict the price of a new house.
            </p>

            <div class="info-box">
                <strong>Key Point:</strong>
                Regression is mainly used when the output is a
                continuous numerical value.
            </div>

            <button class="complete-btn"
                    onclick="markCompleted()">
                Mark as Completed
            </button>

            <div id="completeMessage"></div>

        `
    },


    {
        title: "Classification",

        content: `

            <h2>Classification</h2>

            <p>
                Classification is a supervised Machine Learning
                technique used to predict categories or classes.
            </p>

            <h3>Examples</h3>

            <ul>
                <li>Email → Spam or Not Spam</li>
                <li>Student → Pass or Fail</li>
                <li>Transaction → Fraud or Normal</li>
                <li>Image → Cat or Dog</li>
                <li>Patient → Disease or No Disease</li>
            </ul>

            <h3>Types of Classification</h3>

            <ul>
                <li><strong>Binary Classification</strong> – Two classes.</li>
                <li><strong>Multiclass Classification</strong> – More than two classes.</li>
                <li><strong>Multilabel Classification</strong> – Multiple labels can be assigned.</li>
            </ul>

            <h3>Popular Algorithms</h3>

            <ul>
                <li>Logistic Regression</li>
                <li>Decision Tree</li>
                <li>Random Forest</li>
                <li>K-Nearest Neighbors</li>
<li>Support Vector Machine</li>

</ul>

<h3>Real-World Applications</h3>

<ul>

    <li>Spam email detection</li>
    <li>Credit card fraud detection</li>
    <li>Medical diagnosis</li>
    <li>Image classification</li>
    <li>Recommendation systems</li>

</ul>

<p>
    Classification is widely used when the output belongs to a specific category.
</p>

<button class="complete-btn"
        onclick="markCompleted()">
    Mark as Completed
</button>

<div id="completeMessage"></div>

`,

title: "Machine Learning Quiz",

content: `

<div class="quiz">

    <h2>🤖 Machine Learning Quiz</h2>

    <p id="quizQuestion"></p>

    <div id="quizOptions"></div>

    <button class="complete-btn"
            id="nextQuizBtn"
            onclick="nextQuizQuestion()"
            style="display:none;">
        Next Question
    </button>

    <div id="quizResult"></div>

</div>

`
}
];

const quizQuestions = [

{
    question: "Which type of Machine Learning uses labeled data?",
    options: [
        "Supervised Learning",
        "Unsupervised Learning",
        "Reinforcement Learning",
        "Deep Learning"
    ],
    answer: 0
},

{
    question: "Which algorithm is commonly used for clustering?",
    options: [
        "K-Means",
        "Linear Regression",
        "Logistic Regression",
        "Decision Tree"
    ],
    answer: 0
},

{
    question: "Which technique is used to predict continuous numerical values?",
    options: [
        "Classification",
        "Regression",
        "Clustering",
        "Association"
    ],
    answer: 1
},

{
    question: "What is the main purpose of testing data?",
    options: [
        "Train the model",
        "Increase the dataset",
        "Evaluate the model on unseen data",
        "Remove all data"
    ],
    answer: 2
},

{
    question: "A model performs very well on training data but poorly on new data. What is this called?",
    options: [
        "Underfitting",
        "Overfitting",
        "Clustering",
        "Classification"
    ],
    answer: 1
}

];

let currentLesson = 0;

let currentQuizQuestion = 0;

let quizScore = 0;

let quizAnswered = false;


function showLesson(index) {

    currentLesson = index;

    const lessonContent =
        document.getElementById("lessonContent");

    lessonContent.innerHTML =
        lessons[index].content;

    if (index === lessons.length - 1) {

        loadQuizQuestion();

    }

    updateNavigation();

}


function updateNavigation() {

    const content =
        document.getElementById("lessonContent");

    const oldNavigation =
        document.querySelector(".navigation");

    if (oldNavigation) {

        oldNavigation.remove();

    }

    const navigation =
        document.createElement("div");

    navigation.className = "navigation";

    navigation.innerHTML = `

        <button onclick="previousLesson()"
                ${currentLesson === 0 ? "disabled" : ""}>
            ⬅ Previous
        </button>

        <button onclick="nextLesson()"
                ${currentLesson === lessons.length - 1 ? "disabled" : ""}>
            Next ➡
        </button>

    `;

    content.appendChild(navigation);

}


function markCompleted() {

    let completedLessons =
        JSON.parse(
            localStorage.getItem("mlCompletedLessons") || "[]"
        );

    if (!completedLessons.includes(currentLesson)) {

        completedLessons.push(currentLesson);

    }

    localStorage.setItem(
        "mlCompletedLessons",
        JSON.stringify(completedLessons)
    );

    document.getElementById("completeMessage").innerHTML =
        "✅ Lesson completed successfully!";

    updateProgress();

}


function updateProgress() {

    const completedLessons =
        JSON.parse(
            localStorage.getItem("mlCompletedLessons") || "[]"
        );

    const totalLessons =
        lessons.length - 1;

    let progress =
        Math.round(
            (completedLessons.length / totalLessons) * 100
        );

    if (progress > 100) {

        progress = 100;

    }

    document.getElementById("progressText").innerText =
        progress + "%";

    document.getElementById("progressFill").style.width =
        progress + "%";

}


function nextLesson() {

    if (currentLesson < lessons.length - 1) {

        showLesson(currentLesson + 1);

    }

}


function previousLesson() {

    if (currentLesson > 0) {

        showLesson(currentLesson - 1);

    }

}


function loadQuizQuestion() {

    const question =
        quizQuestions[currentQuizQuestion];

    quizAnswered = false;

    document.getElementById("quizQuestion").innerText =
        (currentQuizQuestion + 1) +
        ". " +
        question.question;

    const optionsContainer =
        document.getElementById("quizOptions");

    optionsContainer.innerHTML = "";

    question.options.forEach(
        (option, index) => {

            const button =
                document.createElement("button");

            button.className = "quiz-option";

            button.innerText = option;

            button.onclick =
                () => checkQuizAnswer(index);

            optionsContainer.appendChild(button);

        }
    );

    document.getElementById("nextQuizBtn")
        .style.display = "none";

}


function checkQuizAnswer(selectedAnswer) {

    if (quizAnswered) {

        return;

    }

    quizAnswered = true;

    const question =
        quizQuestions[currentQuizQuestion];

    const options =
        document.querySelectorAll(".quiz-option");

    options.forEach(
        (button, index) => {

            button.disabled = true;

            if (index === question.answer) {

                button.style.background =
                    "#28a745";

                button.style.color =
                    "white";

            }

            if (
                index === selectedAnswer &&
                selectedAnswer !== question.answer
            ) {

                button.style.background =
                    "#dc3545";

                button.style.color =
                    "white";

            }

        }
    );

    if (selectedAnswer === question.answer) {

        quizScore++;

    }

    document.getElementById("nextQuizBtn")
        .style.display = "block";

}


function nextQuizQuestion() {

    currentQuizQuestion++;

    if (
        currentQuizQuestion <
        quizQuestions.length
    ) {

        loadQuizQuestion();

    } else {

        showQuizResult();

    }

}


function showQuizResult() {

    document.getElementById("quizQuestion")
        .innerText =
        "🎉 Quiz Completed!";

    document.getElementById("quizOptions")
        .innerHTML = "";

    document.getElementById("nextQuizBtn")
        .style.display = "none";

    document.getElementById("quizResult")
        .innerHTML = `

        <h2>
            Your Score: ${quizScore} / ${quizQuestions.length}
        </h2>

        <p>
            ${
                quizScore === quizQuestions.length
                ? "🏆 Excellent! You got all answers correct!"
                : "👍 Good job! Keep practicing."
            }
        </p>

        ${
            quizScore === quizQuestions.length
            ? `
                <div class="completion">
                    <h2>🎉 Congratulations!</h2>
                    <h3>Machine Learning Course Completed!</h3>
                    <p>
                        You have successfully completed
                        all lessons and the quiz. 🏆
                    </p>
                </div>
              `
            : ""
        }

        <button class="complete-btn"
                onclick="restartQuiz()">
            🔄 Try Again
        </button>

    `;

    localStorage.setItem(
        "mlCourseCompleted",
        "true"
    );

}


function restartQuiz() {

    currentQuizQuestion = 0;

    quizScore = 0;

    quizAnswered = false;

    document.getElementById("quizResult")
        .innerHTML = "";

    loadQuizQuestion();

}


// ===============================
// START COURSE
// ===============================

showLesson(0);

updateProgress();

</script>

</body>

</html>
