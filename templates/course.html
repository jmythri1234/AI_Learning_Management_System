<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Python Programming - AI Learn</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }


        /* NAVBAR */

        nav {
            background: #111827;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 22px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }


        /* COURSE HEADER */

        .course-header {
            background:
                linear-gradient(
                    135deg,
                    #3776ab,
                    #ffd343
                );

            color: white;
            padding: 45px 20px;
            text-align: center;
        }

        .course-header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .course-header p {
            font-size: 17px;
        }


        /* PROGRESS */

        .progress-container {
            background: white;
            width: 90%;
            max-width: 1100px;

            margin: 25px auto;
            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 12px;

            background: #e5e7eb;

            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;

            background: #3776ab;

            transition: 0.4s;
        }


        /* MAIN */

        .container {
            width: 90%;
            max-width: 1100px;

            margin: 25px auto;

            display: grid;
            grid-template-columns: 280px 1fr;

            gap: 25px;
        }


        /* LESSON LIST */

        .lessons {
            background: white;
            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

            height: fit-content;
        }

        .lessons h3 {
            margin-bottom: 15px;
        }

        .lesson-btn {
            width: 100%;

            padding: 13px;
            margin-bottom: 10px;

            border: none;
            border-radius: 8px;

            background: #f3f4f6;

            cursor: pointer;

            text-align: left;

            font-weight: bold;

            transition: 0.3s;
        }

        .lesson-btn:hover {
            background: #dbeafe;
        }

        .lesson-btn.active {
            background: #3776ab;
            color: white;
        }


        /* LESSON CONTENT */

        .lesson-content {
            background: white;

            padding: 30px;

            border-radius: 12px;

            min-height: 500px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .lesson-content h2 {
            margin-bottom: 15px;
            color: #3776ab;
        }

        .lesson-content h3 {
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .lesson-content p {
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .lesson-content ul {
            margin-left: 25px;
            line-height: 1.8;
        }


        /* CODE */

        pre {
            background: #111827;
            color: #f9fafb;

            padding: 18px;

            border-radius: 8px;

            overflow-x: auto;

            margin: 20px 0;
        }


        /* COMPLETE BUTTON */

        .complete-btn {
            background: #16a34a;
            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            margin-top: 20px;
        }

        .complete-btn:hover {
            background: #15803d;
        }


        /* NAVIGATION BUTTONS */

        .navigation {
            display: flex;
            justify-content: space-between;

            margin-top: 25px;
        }

        .nav-btn {
            background: #3776ab;
            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .nav-btn:hover {
            background: #285f8f;
        }


        /* QUIZ */

        .quiz-box {
            margin-top: 20px;
        }

        .quiz-question {
            font-size: 20px;
            font-weight: bold;

            margin-bottom: 20px;
        }

        .quiz-option {
            display: block;

            width: 100%;

            padding: 14px;

            margin-bottom: 12px;

            border: 1px solid #d1d5db;

            background: white;

            border-radius: 8px;

            cursor: pointer;

            text-align: left;

            font-size: 15px;
        }

        .quiz-option:hover {
            background: #eff6ff;
        }

        .quiz-result {
            margin-top: 20px;
        }

        .completion {
            margin-top: 20px;

            padding: 20px;

            background: #ecfdf5;

            border-left: 5px solid #16a34a;

            border-radius: 8px;
        }


        /* RESPONSIVE */

        @media (max-width: 768px) {

            nav {
                padding: 15px 20px;

                flex-direction: column;
                gap: 10px;
            }

            nav a {
                margin-left: 10px;
            }

            .course-header h1 {
                font-size: 30px;
            }

            .container {
                grid-template-columns: 1fr;
            }

            .lessons {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav>

    <h2>🐍 AI Learn</h2>

    <div>

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

    </div>

</nav>



<!-- COURSE HEADER -->

<section class="course-header">

    <h1>
        🐍 Python Programming
    </h1>

    <p>
        Learn Python programming from basics to advanced concepts.
    </p>

</section>



<!-- PROGRESS -->

<div class="progress-container">

    <div class="progress-text">

        <span>
            Course Progress
        </span>

        <span id="progressText">
            0%
        </span>

    </div>

    <div class="progress-bar">

        <div
            class="progress-fill"
            id="progressFill">
        </div>

    </div>

</div>



<!-- MAIN CONTENT -->

<div class="container">


    <!-- LESSONS -->

    <div class="lessons">

        <h3>
            📚 Lessons
        </h3>


        <button
            class="lesson-btn active"
            onclick="showLesson(0)">

            1. Introduction to Python

        </button>


        <button
            class="lesson-btn"
            onclick="showLesson(1)">

            2. Variables & Data Types

        </button>


        <button
            class="lesson-btn"
            onclick="showLesson(2)">

            3. Operators

        </button>


        <button
            class="lesson-btn"
            onclick="showLesson(3)">

            4. Conditional Statements

        </button>


        <button
            class="lesson-btn"
            onclick="showLesson(4)">

            5. Loops

        </button>


        <button
            class="lesson-btn"
            onclick="showLesson(5)">

            6. Functions

        </button>


        <button
            class="lesson-btn"
            onclick="showLesson(6)">

            7. Lists & Dictionaries

        </button>


        <button
            class="lesson-btn"
            onclick="showLesson(7)">

            8. Python Quiz

        </button>

    </div>



    <!-- LESSON CONTENT -->

    <div
        class="lesson-content"
        id="lessonContent">

    </div>

</div>



<script>


const lessons = [

    {
        title: "Introduction to Python",

        content: `

            <h2>🐍 Introduction to Python</h2>

            <p>
                Python is a high-level, interpreted programming
                language known for its simple and readable syntax.
            </p>

            <h3>Why Learn Python?</h3>

            <ul>

                <li>Easy to learn</li>

                <li>Simple syntax</li>

                <li>Used in Artificial Intelligence</li>

                <li>Used in Machine Learning</li>

                <li>Used in Web Development</li>

                <li>Large community support</li>

            </ul>

            <h3>First Python Program</h3>

            <pre>
print("Hello, World!")
            </pre>

            <p>
                The print() function is used to display output
                on the screen.
            </p>

        `
    },


    {
        title: "Variables & Data Types",

        content: `

            <h2>📦 Variables & Data Types</h2>

            <p>
                Variables are used to store data in a program.
            </p>

            <h3>Example</h3>

            <pre>
name = "Ajay"
age = 20
height = 5.8
is_student = True
            </pre>

            <h3>Common Data Types</h3>

            <ul>

                <li>String</li>

                <li>Integer</li>

                <li>Float</li>

                <li>Boolean</li>

                <li>List</li>

                <li>Dictionary</li>

            </ul>

        `
    },


    {
        title: "Operators",

        content: `

            <h2>➕ Python Operators</h2>

            <p>
                Operators are used to perform operations
                on values and variables.
            </p>

            <h3>Arithmetic Operators</h3>

            <pre>
a = 10
b = 5

print(a + b)
print(a - b)
print(a * b)
print(a / b)
            </pre>

            <h3>Types of Operators</h3>

            <ul>

                <li>Arithmetic Operators</li>

                <li>Comparison Operators</li>

                <li>Logical Operators</li>

                <li>Assignment Operators</li>

            </ul>

        `
    },


    {
        title: "Conditional Statements",

        content: `

            <h2>🔀 Conditional Statements</h2>

            <p>
                Conditional statements are used to make
                decisions in a Python program.
            </p>

            <h3>if Statement</h3>

            <pre>
age = 18

if age >= 18:
    print("You are eligible")
            </pre>

            <h3>if-else Example</h3>

            <pre>
age = 16

if age >= 18:
    print("Adult")
else:
    print("Minor")
            </pre>

        `
    },


    {
        title: "Loops",

        content: `

            <h2>🔁 Loops in Python</h2>

            <p>
                Loops are used to execute a block of code
                repeatedly.
            </p>

            <h3>For Loop</h3>

            <pre>
for i in range(5):
    print(i)
            </pre>

            <h3>While Loop</h3>

            <pre>
i = 1

while i <= 5:
    print(i)
    i += 1
            </pre>

            <p>
                Python mainly provides for and while loops.
            </p>

        `
    },


    {
        title: "Functions",

        content: `

            <h2>⚙️ Functions in Python</h2>

            <p>
                A function is a reusable block of code
                designed to perform a specific task.
            </p>

            <h3>Creating a Function</h3>

            <pre>
def greet():
    print("Hello!")

greet()
            </pre>

            <h3>Function with Parameters</h3>

            <pre>
def add(a, b):
    return a + b

result = add(10, 20)

print(result)
            </pre>

        `
    },


    {
        title: "Lists & Dictionaries",

        content: `

            <h2>📋 Lists & Dictionaries</h2>

            <h3>Lists</h3>

            <p>
                A list is an ordered collection of items.
            </p>

            <pre>
fruits = [
    "Apple",
    "Banana",
    "Mango"
]

print(fruits[0])
            </pre>

            <h3>Dictionaries</h3>

            <p>
                A dictionary stores data using key-value pairs.
            </p>

            <pre>
student = {
    "name": "Ajay",
    "age": 20,
    "course": "BTech"
}

print(student["name"])
            </pre>

        `
    }

];



/* QUIZ */

const quizQuestions = [

    {
        question:
            "What is Python?",

        options: [
            "A programming language",
            "A database",
            "An operating system",
            "A web browser"
        ],

        answer: 0
    },


    {
        question:
            "Which function is used to display output in Python?",

        options: [
            "display()",
            "print()",
            "show()",
            "output()"
        ],

        answer: 1
    },


    {
        question:
            "Which symbol is used for comments in Python?",

        options: [
            "//",
            "/* */",
            "#",
            "<!-- -->"
        ],

        answer: 2
    },


    {
        question:
            "Which data type stores True or False?",

        options: [
            "String",
            "Boolean",
            "Integer",
            "Float"
        ],

        answer: 1
    },


    {
        question:
            "Which keyword is used to define a function?",

        options: [
            "function",
            "define",
            "def",
            "func"
        ],

        answer: 2
    }

];



let currentLesson = 0;

let currentQuizQuestion = 0;

let quizScore = 0;


let completedLessons =
    JSON.parse(
        localStorage.getItem(
            "pythonCompletedLessons"
        )
    ) || [];



function showLesson(index) {

    currentLesson = index;


    const buttons =
        document.querySelectorAll(
            ".lesson-btn"
        );


    buttons.forEach(
        button => {

            button.classList.remove(
                "active"
            );

        }
    );


    buttons[index].classList.add(
        "active"
    );


    const lessonContent =
        document.getElementById(
            "lessonContent"
        );


    if (index === 7) {

        showQuiz();

        return;

    }


    lessonContent.innerHTML =

        lessons[index].content;


    const completeButton =
        document.createElement(
            "button"
        );


    completeButton.className =
        "complete-btn";


    completeButton.innerText =
        completedLessons.includes(index)

            ? "✅ Lesson Completed"

            : "✅ Mark Lesson as Completed";


    completeButton.onclick =
        markCompleted;


    lessonContent.appendChild(
        completeButton
    );


    const navigation =
        document.createElement(
            "div"
        );


    navigation.className =
        "navigation";


    navigation.innerHTML = `

        <button
            class="nav-btn"
            onclick="previousLesson()">

            ◀ Previous

        </button>


        <button
            class="nav-btn"
            onclick="nextLesson()">

            Next ▶

        </button>

    `;


    lessonContent.appendChild(
        navigation
    );


    updateProgress();

}



function markCompleted() {

    if (
        !completedLessons.includes(
            currentLesson
        )
    ) {

        completedLessons.push(
            currentLesson
        );


        localStorage.setItem(

            "pythonCompletedLessons",

            JSON.stringify(
                completedLessons
            )

        );

    }


    showLesson(
        currentLesson
    );

}



function previousLesson() {

    if (currentLesson > 0) {

        showLesson(
            currentLesson - 1
        );

    }

}



function nextLesson() {

    if (currentLesson < 7) {

        showLesson(
            currentLesson + 1
        );

    }

}



function updateProgress() {

    const progress =
        Math.round(
            (
                completedLessons.length
                / 7
            ) * 100
        );


    document.getElementById(
        "progressText"
    ).innerText =
        progress + "%";


    document.getElementById(
        "progressFill"
    ).style.width =
        progress + "%";

}



/* QUIZ FUNCTIONS */

function showQuiz() {

    const lessonContent =
        document.getElementById(
            "lessonContent"
        );


    lessonContent.innerHTML = `

        <div class="quiz-box">

            <h2>
                📝 Python Quiz
            </h2>

            <p
                id="quizQuestion"
                class="quiz-question">
            </p>

            <div
                id="quizOptions">
            </div>

            <button
                id="nextQuizBtn"
                class="nav-btn"
                onclick="nextQuizQuestion()"
                style="display:none;">

                Next Question ▶

            </button>

            <div
                id="quizResult"
                class="quiz-result">
            </div>

        </div>

    `;


    loadQuizQuestion();

}



function loadQuizQuestion() {

    const question =
        quizQuestions[
            currentQuizQuestion
        ];


    document.getElementById(
        "quizQuestion"
    ).innerText =

        `${currentQuizQuestion + 1}. ${question.question}`;


    const options =
        document.getElementById(
            "quizOptions"
        );


    options.innerHTML = "";


    question.options.forEach(
        (option, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "quiz-option";


            button.innerText =
                option;


            button.onclick =
                () =>
                    checkQuizAnswer(
                        index
                    );


            options.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "nextQuizBtn"
    ).style.display =
        "none";

}



function checkQuizAnswer(
    selectedAnswer
) {

    const question =
        quizQuestions[
            currentQuizQuestion
        ];


    const options =
        document.querySelectorAll(
            ".quiz-option"
        );


    options.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    if (
        selectedAnswer ===
        question.answer
    ) {

        quizScore++;


        options[
            selectedAnswer
        ].innerText +=
            " ✅";

    }

    else {

        options[
            selectedAnswer
        ].innerText +=
            " ❌";


        options[
            question.answer
        ].innerText +=
            " ✅";

    }


    document.getElementById(
        "nextQuizBtn"
    ).style.display =
        "inline-block";

}



function nextQuizQuestion() {

    currentQuizQuestion++;


    if (
        currentQuizQuestion <
        quizQuestions.length
    ) {

        loadQuizQuestion();

    }

    else {

        showQuizResult();

    }

}



function showQuizResult() {

    document.getElementById(
        "quizQuestion"
    ).innerText =
        "🎉 Quiz Completed!";


    document.getElementById(
        "quizOptions"
    ).innerHTML = "";


    document.getElementById(
        "nextQuizBtn"
    ).style.display =
        "none";


    document.getElementById(
        "quizResult"
    ).innerHTML = `

        <h2>
            Your Score:
            ${quizScore} /
            ${quizQuestions.length}
        </h2>


        <p>

            ${
                quizScore ===
                quizQuestions.length

                ? "🏆 Excellent! You got all answers correct!"

                : "👍 Good job! Keep practicing."

            }

        </p>


        ${
            quizScore ===
            quizQuestions.length

            ? `

                <div class="completion">

                    <h2>
                        🎉 Congratulations!
                    </h2>

                    <h3>
                        Python Programming
                        Course Completed!
                    </h3>

                    <p>
                        You have successfully
                        completed all lessons
                        and the quiz. 🏆
                    </p>

                </div>

              `

            : ""

        }


        <button
            class="complete-btn"
            onclick="restartQuiz()">

            🔄 Try Again

        </button>

    `;


    localStorage.setItem(
        "pythonCourseCompleted",
        "true"
    );

}



function restartQuiz() {

    currentQuizQuestion = 0;

    quizScore = 0;


    document.getElementById(
        "quizResult"
    ).innerHTML = "";


    loadQuizQuestion();

}



showLesson(0);

updateProgress();


</script>


</body>

</html>
